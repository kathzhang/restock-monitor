name: VCA Restock Monitor
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=检测库存; test-email=测试邮件; test-bark=测试响铃'
        type: choice
        options:
          - check
          - test-email
          - test-bark
        default: check
permissions:
  contents: read
concurrency:
  group: vca-restock
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    timeout-minutes: 8
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependency
        run: python -m pip install -r requirements.txt
      - name: Test email
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-email'
        run: python monitor.py --test-email
      - name: Test Bark (critical alert)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-bark'
        run: python monitor.py --test-bark
      - name: Check stock
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'check'
        run: python monitor.py
      - name: Save diagnostic screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vca-diagnostics-${{ github.run_id }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 7
  iphone:
    name: iPhone Duo pickup (nearest 12 stores)
    if: inputs.mode == 'check'
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    timeout-minutes: 8
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependency
        run: python -m pip install playwright==1.58.0
      - name: Check iPhone pickup and notify when available
        run: python iphone_monitor.py
      - name: Save iPhone diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-diagnostics-${{ github.run_id }}
          path: artifacts/iphone/
          if-no-files-found: ignore
          retention-days: 7
