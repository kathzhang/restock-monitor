name: iPhone Duo Pickup Monitor
on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'check=检测并通知; check-only=仅检测; test-email=测试邮件; test-bark=测试响铃'
        type: choice
        options:
          - check
          - check-only
          - check-document
          - test-email
          - test-bark
        default: check-only
permissions:
  contents: read
concurrency:
  group: iphone-duo-pickup
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright/python:v1.58.0-noble
      options: --ipc=host
    timeout-minutes: 8
    env:
      GMAIL_USER: ${{ secrets.GMAIL_USER }}
      GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
      EMAIL_TO: ${{ secrets.EMAIL_TO }}
      BARK_KEY: ${{ secrets.BARK_KEY }}
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
      - name: Install Python dependency
        run: python -m pip install playwright==1.58.0
      - name: Test email
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-email'
        run: python iphone_monitor.py --test-email
      - name: Test Bark
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'test-bark'
        run: python iphone_monitor.py --test-bark
      - name: Check only (no notifications)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-only'
        run: python iphone_monitor.py --check-only
      - name: Diagnose pickup URL (no notifications)
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'check-document'
        run: python iphone_monitor.py --document --check-only
      - name: Check pickup availability
        if: github.event_name != 'workflow_dispatch' || inputs.mode == 'check'
        run: python iphone_monitor.py
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iphone-diagnostics-${{ github.run_id }}
          path: artifacts/iphone/
          if-no-files-found: ignore
          retention-days: 7
